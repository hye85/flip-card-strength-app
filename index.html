<!DOCTYPE html>
<html lang="ko">
<head>

      --blue:#1f78b4;

      --green:#1f7a55;
      --gray:#f3f4f6;
      --ink:#222;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Pretendard','Noto Sans KR',system-ui,sans-serif;background:#faf7f1;color:var(--ink)}
    header{position:sticky;top:0;z-index:10;background:rgba(250,247,241,.96);border-bottom:1px solid #e7dfd4;padding:18px 22px}
    h1{margin:0;font-size:26px}.sub{margin:6px 0 0;color:#666;font-size:14px}
    main{max-width:1280px;margin:0 auto;padding:24px}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0;padding:14px;background:#fff;border:1px solid #eadfd1;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.05)}

    .count{font-weight:800;color:var(--red)}
    .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}

    .card:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(0,0,0,.12)}.card.selected{outline:5px solid rgba(179,33,45,.25);transform:translateY(-3px)}
    .num{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:800;z-index:2}.emoji{font-size:34px;margin-top:34px}.ko{font-size:20px;font-weight:800;line-height:1.25;white-space:pre-line}.en{font-size:13px;color:#555;line-height:1.2}.typeLabel{font-size:12px;font-weight:900;color:#666}
    .red{border-color:var(--red)}.orange{border-color:var(--orange)}.blue{border-color:var(--blue)}.purple{border-color:var(--purple)}.green{border-color:var(--green)}
    .hidden{display:none!important}
    .flipGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}.flipCard{height:220px;perspective:1000px;cursor:pointer}.flipInner{height:100%;transition:transform .55s;transform-style:preserve-3d}.flipCard.flipped .flipInner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden}.back{transform:rotateY(180deg)}
    .panel{background:#fff;border:1px solid #eadfd1;border-radius:22px;padding:22px;margin:18px 0;box-shadow:0 5px 14px rgba(0,0,0,.05)}

    .typeDetailGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.typeDetailCard{border-radius:22px;overflow:hidden;border:3px solid #ddd;background:#fff;word-break:keep-all;overflow-wrap:break-word}.typeDetailCard.red{border-color:var(--red)}.typeDetailCard.orange{border-color:var(--orange)}.typeDetailCard.blue{border-color:var(--blue)}.typeDetailCard.purple{border-color:var(--purple)}.typeDetailCard.green{border-color:var(--green)}.typeDetailTop{padding:22px;text-align:center}.typeIcon{width:74px;height:74px;margin:0 auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px}.typeIcon.red{background:var(--red)}.typeIcon.orange{background:var(--orange)}.typeIcon.blue{background:var(--blue)}.typeIcon.purple{background:var(--purple)}.typeIcon.green{background:var(--green)}.keywordGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:320px;margin:14px auto 0}.keyword{font-weight:900;color:#5a2b31;font-size:18px}.typeDetailBottom{background:#d8d2cc;padding:18px 22px;line-height:1.75}.typeDetailBottom h4{margin:0 0 10px;text-align:center;font-size:18px}.typeDetailBottom ul{margin:0;padding-left:22px}.barWrap{display:grid;grid-template-columns:90px 1fr 44px;gap:10px;align-items:center;margin:8px 0}.bar{height:18px;background:#eee;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:#b3212d}.printOnly{display:none}

    @media print{
      @page{
        size:auto;
        margin:8mm;
      }

      html,body{
        background:#fff !important;
        margin:0 !important;
        padding:0 !important;
      }

      header,.toolbar,#selectSection,#flipSection button,.noPrint{
        display:none !important;
      }

      main{
        max-width:100% !important;
        width:100% !important;
        margin:0 !important;
        padding:0 !important;
      }

      #resultSection,
      #resultArea{
        margin:0 !important;
        padding:0 !important;
      }

      .panel{
        margin:6px 0 !important;
        padding:14px !important;
        border:1px solid #ccc !important;
        border-radius:12px !important;
        box-shadow:none !important;
        break-inside:auto !important;
        page-break-inside:auto !important;
      }

      .sectionTitle{
        margin:10px 0 8px !important;
      }

      .resultTitle{
        margin-bottom:6px !important;
      }

      .chips{
        margin-bottom:8px !important;
      }

      .printOnly{
        display:block;
      }

      .miniList{
        grid-template-columns:repeat(2,1fr);
        gap:8px !important;
      }

      .cols{
        grid-template-columns:1fr 1fr;
        gap:10px !important;
      }

      .typeDetailGrid{
        display:grid !important;
        grid-template-columns:1fr 1fr !important;
        gap:10px !important;
        align-items:start;
      }

      .typeDetailCard{
        width:100% !important;
        break-inside:avoid;
        page-break-inside:avoid;
      }

      .typeDetailTop{
        padding:12px !important;
      }

      .typeDetailBottom{
        padding:10px 14px !important;
      }

      .summaryTable th,
      .summaryTable td{
        padding:6px !important;
        font-size:12px !important;
      }

      .situation{
        min-height:70px !important;
        padding:8px !important;
      }

      /* 소제목과 해당 내용이 가능하면 한 페이지 안에 함께 나오도록 묶기 */
      .panel{
        break-inside:avoid !important;
        page-break-inside:avoid !important;
      }

      /* 표 영역은 전체가 길 수 있으므로, 행 단위로만 잘림 방지 */
      .panel:has(.summaryTable){
        break-inside:auto !important;
        page-break-inside:auto !important;
      }

      .summaryTable tr{
        break-inside:avoid !important;
        page-break-inside:avoid !important;
      }

      .summaryTable thead{
        display:table-header-group;
      }

      .sectionTitle,
      h2,h3,h4{
        break-after:avoid !important;
        page-break-after:avoid !important;
      }

      p,ul,.chips,.barWrap,.typeDetailGrid,.miniList,.cols{
        break-before:avoid !important;
        page-break-before:avoid !important;
      }

      .typeDetailGrid,
      .miniList,
      .cols,
      .typeBox,
      .typeDetailCard,
      .situation{
        break-inside:avoid !important;
        page-break-inside:avoid !important;
      }
    }
  </style>
</head>
<body>
<header>
  <h1>FLIP 강점 발견 카드 웹 앱</h1>
  <p class="sub">1단계: 나에게 해당되는 약점 카드를 선택 → 2단계: 선택 카드 뒤집기 → 3단계: 강점과 활용 상황 확인</p>
</header>
<main>
  <section id="selectSection">
    <div class="toolbar">
      <span>선택한 약점 카드: <b class="count" id="selectedCount">0</b>장</span>
      <button id="finishBtn">완료하고 강점 보기</button>
      <button class="secondary" id="clearBtn">선택 초기화</button>
    </div>
    <div class="grid" id="weakGrid"></div>
  </section>

  <section id="flipSection" class="hidden">
    <div class="toolbar">
      <span>선택한 약점 카드를 클릭하면 강점 카드로 뒤집힙니다.</span>
      <button id="showResultBtn">최종 결과 보기</button>
      <button class="secondary" id="backBtn">다시 선택하기</button>
    </div>
    <div class="flipGrid" id="flipGrid"></div>
  </section>

  <section id="resultSection" class="hidden">
    <div class="toolbar noPrint">
      <button onclick="window.print()">결과 인쇄하기</button>
      <button id="sharePdfBtn">PDF로 카카오톡 공유하기</button>
      <button class="secondary" id="restartBtn">처음부터 다시</button>
    </div>
    <div id="resultArea"></div>
  </section>
</main>

let selected = new Set();
const weakGrid = document.getElementById('weakGrid');
function cardHTML(c, mode='weak'){
  const text = mode==='strength'?c.s:c.w;
  return `<div class="card ${mode==='strength' ? c.t : ''}" data-n="${c.n}"><div class="num">${c.n}</div><div class="emoji">${c.e}</div><div class="ko">${text}</div><div class="en">${mode==='strength'?'Strength':'Weakness'}</div></div>`;
}
function renderWeak(){
  weakGrid.innerHTML = cards.map(c=>cardHTML(c,'weak')).join('');
  weakGrid.querySelectorAll('.card').forEach(el=>{
    const n=+el.dataset.n;if(selected.has(n))el.classList.add('selected');
    el.onclick=()=>{selected.has(n)?selected.delete(n):selected.add(n);renderWeak();updateCount();}
  });updateCount();
}
function updateCount(){document.getElementById('selectedCount').textContent=selected.size;}
function renderFlip(){
  const chosen = cards.filter(c=>selected.has(c.n));
  document.getElementById('flipGrid').innerHTML = chosen.map(c=>`<div class="flipCard"><div class="flipInner"><div class="face">${cardHTML(c,'weak')}</div><div class="face back">${cardHTML(c,'strength')}</div></div></div>`).join('');
  document.querySelectorAll('.flipCard').forEach(el=>el.onclick=()=>el.classList.toggle('flipped'));
}
function getCounts(chosen){return chosen.reduce((a,c)=>(a[c.t]=(a[c.t]||0)+1,a),{});} 
function topType(counts){return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0]||'red';}
function fitSituations(type, good=true){
  return situations.filter(s=>good?s.need.includes(type):s.hard.includes(type)).slice(0, good?5:3);
}
function renderBars(counts){
 const max=Math.max(1,...Object.values(counts));
 return Object.keys(typeInfo).map(t=>`<div class="barWrap"><b>${typeInfo[t].name}</b><div class="bar"><span style="width:${((counts[t]||0)/max)*100}%;background:var(--${t})"></span></div><b>${counts[t]||0}</b></div>`).join('');
}
function renderTypeDetail(tt){
 const info=typeInfo[tt], d=typeDetails[tt];
 return `<div class="panel"><h3 class="sectionTitle">${info.name} 유형 상세 카드</h3><div class="typeDetailGrid">
  <div class="typeDetailCard ${tt}"><div class="typeDetailTop"><div class="typeIcon ${tt}">${d.icon}</div><h3>${info.name}</h3><div class="keywordGrid">${d.weakKeywords.map(k=>`<div class="keyword"># ${k}</div>`).join('')}</div></div><div class="typeDetailBottom"><h4>사용 시 주의사항</h4><ul>${d.cautions.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>

 </div></div>`;
}

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
async function createResultPdfBlob(){
  const target = document.getElementById('resultArea');
  const buttons = document.querySelectorAll('.noPrint');
  buttons.forEach(b => b.style.visibility = 'hidden');

  const canvas = await html2canvas(target, {
    scale: 2,
    useCORS: true,
    backgroundColor: '#ffffff',
    windowWidth: document.documentElement.scrollWidth
  });

  buttons.forEach(b => b.style.visibility = '');

  const imgData = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');
  const pdfWidth = pdf.internal.pageSize.getWidth();
  const pdfHeight = pdf.internal.pageSize.getHeight();
  const imgWidth = pdfWidth;
  const imgHeight = canvas.height * imgWidth / canvas.width;

  let heightLeft = imgHeight;
  let position = 0;

  pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
  heightLeft -= pdfHeight;

  while (heightLeft > 0) {
    position = heightLeft - imgHeight;
    pdf.addPage();
    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
    heightLeft -= pdfHeight;
  }

  return pdf.output('blob');
}

document.addEventListener('click', async function(e){
  if(e.target && e.target.id === 'sharePdfBtn'){
    const btn = e.target;
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'PDF 만드는 중...';

    try{
      const pdfBlob = await createResultPdfBlob();
      const file = new File([pdfBlob], 'FLIP_강점결과.pdf', { type: 'application/pdf' });

      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          title: 'FLIP 강점 발견 결과',
          text: '나의 강점 결과 PDF입니다.',
          files: [file]
        });
      } else {
        const link = document.createElement('a');
        link.download = 'FLIP_강점결과.pdf';
        link.href = URL.createObjectURL(pdfBlob);
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 3000);
        alert('PDF 파일이 다운로드되었습니다. 카카오톡에 첨부해서 보내주세요.');
      }
    }catch(err){
      console.error(err);
      alert('PDF 생성 중 오류가 발생했습니다. 다시 시도해 주세요.');
    }finally{
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }
});
</script>
